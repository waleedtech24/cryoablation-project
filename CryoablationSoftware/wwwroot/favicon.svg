<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Blue rounded square background -->
  <rect width="32" height="32" rx="7" fill="#4169e1"/>

  <!-- Medical cross (soft, rounded) -->
  <rect x="11" y="3"  width="10" height="26" rx="3.5" fill="rgba(255,255,255,0.18)"/>
  <rect x="3"  y="11" width="26" height="10" rx="3.5" fill="rgba(255,255,255,0.18)"/>

  <!-- Snowflake — main axes -->
  <line x1="16" y1="7"  x2="16" y2="25" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="7"  y1="16" x2="25" y2="16" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Snowflake — diagonal axes -->
  <line x1="9.5"  y1="9.5"  x2="22.5" y2="22.5" stroke="rgba(255,255,255,0.55)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22.5" y1="9.5"  x2="9.5"  y2="22.5" stroke="rgba(255,255,255,0.55)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Branch tips — top -->
  <line x1="16" y1="7"  x2="13" y2="10" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="7"  x2="19" y2="10" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Branch tips — bottom -->
  <line x1="16" y1="25" x2="13" y2="22" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="25" x2="19" y2="22" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Branch tips — left -->
  <line x1="7"  y1="16" x2="10" y2="13" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="7"  y1="16" x2="10" y2="19" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Branch tips — right -->
  <line x1="25" y1="16" x2="22" y2="13" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="25" y1="16" x2="22" y2="19" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="3.2" fill="#7dd3fc"/>
  <circle cx="16" cy="16" r="1.5" fill="#ffffff"/>
</svg>
